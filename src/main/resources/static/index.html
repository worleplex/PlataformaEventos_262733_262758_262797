<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar sesión - EventYunks</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <div class="contenedor barra">
            <a class="logo" href="index.html">
                <img src="img/logo.png" alt="Logo">
                EventYunks
            </a>
        </div>
    </header>

    <main class="contenedor">
        <div class="formulario">
            <h1>Acceso a la plataforma</h1>

            <div class="tabs">
                <a class="activa" href="index.html">Iniciar Sesión</a>
                <a href="registro.html">Registrarse</a>
            </div>

            <form action="catalogo.html">
                <div class="campo">
                    <label for="correo">Correo electrónico</label>
                    <input id="correo" type="email" placeholder="nombre@correo.com" required>
                </div>

                <div class="campo">
                    <label for="pass">Contraseña</label>
                    <input id="pass" type="password" placeholder="Introduce tu contraseña" required>
                    <p class="error oculto">Usuario Incorrecto</p>
                </div>

                <button class="boton" type="submit">Entrar</button>
            </form>
        </div>
    </main>
</body>
</html>
