<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Error en el pago - EventYunks</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <div class="contenedor barra">
            <a class="logo" href="catalogo.html">
                <img src="img/logo.png" alt="Logo">
                EventYunks
            </a>
            <nav>
                <a href="catalogo.html">Catálogo</a>
                <a href="mis-tickets.html">Mis tickets</a>
                <a href="index.html">cerrar sesión</a>
            </nav>
        </div>
    </header>

    <main class="contenedor detalle">
        <section class="aviso estado fallo">
            <h1><span class="icono" aria-hidden="true">✕</span> Error en el pago</h1>
            <p>Error al procesar el pago. La compra no se ha realizado.</p>
            <span class="etiqueta">Estado: Cancelado</span>
        </section>

        <section class="caja blanca">
            <h2 class="titulo-seccion">Detalle de transacción</h2>
            <p class="linea"><span class="suave">Monto</span> <strong>$700</strong></p>
            <p class="linea"><span class="suave">Método</span> <strong>Tarjeta •••• 4242</strong></p>
            <p class="linea"><span class="suave">Boletos</span> <strong>2 (General A-1 + VIP A-3)</strong></p>
        </section>
        <div class="acciones horizontal">
            <a class="boton" href="mis-tickets.html">Ver mis tickets</a>
            <a class="boton secundario" href="catalogo.html">Volver al catálogo</a>
        </div>
    </main>
</body>
</html>
