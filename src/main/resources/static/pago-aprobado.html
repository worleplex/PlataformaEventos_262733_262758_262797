<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pago aprobado - EventYunks</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <div class="contenedor barra">
            <a class="logo" href="catalogo.html">
                <img src="img/logo.png" alt="Logo">
                EventYunks
            </a>
            <nav>
                <a href="catalogo.html">Catálogo</a>
                <a href="mis-tickets.html">Mis tickets</a>
                <a href="index.html">cerrar sesión</a>
            </nav>
        </div>
    </header>

    <main class="contenedor detalle">
        <section class="aviso estado exito">
            <h1><span class="icono" aria-hidden="true">✓</span> ¡Pago aprobado!</h1>
            <p>Tu transacción fue aprobada. Los tickets han sido generados.</p>
            <span class="etiqueta">Estado: Aprobado</span>
        </section>

        <section class="caja blanca">
            <h2 class="titulo-seccion">Comprobante de pago</h2>
            <p class="linea"><span class="suave">Monto cobrado</span> <strong class="verde">$700</strong></p>
            <p class="linea"><span class="suave">Método</span> <strong>Tarjeta •••• 4242</strong></p>
            <p class="linea"><span class="suave">Folio</span> <strong class="precio">#EY-TXN-20261120</strong></p>
        </section>
        <div class="acciones horizontal">
            <a class="boton" href="compra-completada.html">Ver mis tickets</a>
            <a class="boton secundario" href="catalogo.html">Volver al catálogo</a>
        </div>
    </main>
</body>
</html>
