<th:block th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
    <title>Editar organizador - EventYunks</title>
    <main class="contenedor admin">
    <h1>Panel de Administrador</h1>
    <p><strong>Selección de categoría</strong></p>
    <nav class="tabs" aria-label="Categorías de gestión">
<a class="activa" th:href="@{/admin/organizadores}">Gestión de Organizadores</a>
<a th:href="@{/admin/artistas}">Gestión de Artistas</a>
<a th:href="@{/admin/recintos}">Gestión de Recintos</a>
</nav>

    <section>
        <h2>Editar organizador</h2>
        <p class="descripcion">Datos de acceso y contacto del organizador. Todos los campos son obligatorios.</p>
        <form id="form-organizador" class="formulario-crear-editar" th:action="@{/admin/organizadores/editar/{id}(id=${organizador.id})}" method="post">
            <div class="campo">
                <label for="nombre">Nombre</label>
                <input id="nombre" name="nombre" type="text" th:value="${organizador.nombre}" required maxlength="100" placeholder="Nombre del organizador">
            </div>
            <div class="campo" th:classappend="${errorCorreo != null} ? 'invalido'">
                <label for="correo">Correo</label>
                <input id="correo" name="correo" type="email" th:value="${organizador.correo}" required placeholder="nombre@correo.com">
                <p class="error" th:if="${errorCorreo != null}" th:text="${errorCorreo}"></p>
            </div>
            <div class="campo">
                <label for="telefono">Teléfono</label>
                <input id="telefono" name="telefono" type="tel" th:value="${organizador.telefono}" maxlength="20" required placeholder="Ej. 55 1234 5678">
            </div>
            <div class="campo">
                <label for="clave">Restablecer contraseña</label>
                <input id="clave" name="contrasenia" type="password" placeholder="Dejar en blanco para conservar la actual">
            </div>
        </form>
        <div class="acciones horizontal">
            <a class="boton secundario" th:href="@{/admin/organizadores}">Cancelar</a>
            <button class="boton" type="submit" form="form-organizador">Guardar</button>
        </div>
    </section>
</main>
</th:block>
