<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <base th:href="@{/}" href="/">
    <title>Iniciar sesión - EventYunks</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <header>
        <div class="contenedor barra">
            <a class="logo" th:href="@{/}">
                <picture>
                    <source media="(prefers-color-scheme: dark)" th:srcset="@{/img/logo-oscuro.png}">
                    <img th:src="@{/img/logo.png}" alt="Logo de EventYunks">
                </picture>
                EventYunks
            </a>
        </div>
    </header>

    <main class="contenedor">
        <div class="formulario">
            <h1>Acceso a la plataforma</h1>

            <div class="tabs">
                <a class="activa" th:href="@{/}">Iniciar Sesión</a>
                <a th:href="@{/registro.html}">Registrarse</a>
            </div>

            <form th:action="@{/login}" method="post">
                <div class="campo">
                    <label for="correo">Correo electrónico</label>
                    <input id="correo" name="correo" type="email" placeholder="nombre@correo.com" required>
                </div>

                <div class="campo">
                    <label for="pass">Contraseña</label>
                    <input id="pass" name="contrasenia" type="password" placeholder="Introduce tu contraseña" required>
                    <p class="error" th:if="${error}" th:text="${error}">Usuario Incorrecto</p>
                </div>

                <button class="boton" type="submit">Entrar</button>
            </form>
        </div>
    </main>
</body>
</html>
