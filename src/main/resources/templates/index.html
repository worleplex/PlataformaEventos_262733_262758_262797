<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar sesión</title>
</head>
<body>
    <header>
        <div>
            <a href="index.html">
                <img src="img/logo.png" alt="" width="32" height="34">
                EventYunks
            </a>
        </div>
    </header>
    <main>
        <h1>Acceso a la plataforma</h1>
        <nav aria-label="Acceso">
            <a href="index.html" aria-current="page">Iniciar Sesión</a>
            <a href="registro.html">Registrarse</a>
        </nav>
        <form action="catalogo.html" method="post">
            <label>Correo electrónico
                <input type="email" name="correo" placeholder="nombre@correo.com">
            </label>
            <label>Contraseña
                <input type="password" name="contrasena" placeholder="Introduce tu contraseña">
            </label>
            <p id="error-login" role="alert">Usuario Incorrecto</p>
            <button type="submit">Entrar</button>
        </form>
    </main>
    <footer>© 2026 EventYunks</footer>
</body>
</html>
