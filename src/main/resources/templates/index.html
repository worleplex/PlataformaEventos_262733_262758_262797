<th:block th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
    <title>Iniciar sesión - EventYunks</title>
    <main class="contenedor">
        <div class="formulario">
            <h1>Acceso a la plataforma</h1>

            <div class="tabs">
                <a class="activa" th:href="@{/}">Iniciar Sesión</a>
                <a th:href="@{/registro.html}">Registrarse</a>
            </div>

            <form th:action="@{/login}" method="post">
                <div class="campo">
                    <label for="correo">Correo electrónico</label>
                    <input id="correo" name="correo" type="email" placeholder="nombre@correo.com" required>
                </div>

                <div class="campo">
                    <label for="pass">Contraseña</label>
                    <input id="pass" name="contrasenia" type="password" placeholder="Introduce tu contraseña" required>
                    <p class="error" th:if="${error}" th:text="${error}">Usuario Incorrecto</p>
                </div>

                <button class="boton" type="submit">Entrar</button>
            </form>
        </div>
    </main>
</th:block>
