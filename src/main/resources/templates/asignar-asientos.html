<th:block th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
    <title>Asignar asientos - EventYunks</title>
    <main class="contenedor organizador">
    <h1>Asignar asientos</h1>
    <form action="seleccionar-artistas.html">
        <h2>Croquis del recinto</h2>
        <figure class="tarjeta">
            <picture>
                <source media="(prefers-color-scheme: dark)" srcset="img/croquis-recinto-oscuro.png">
                <img src="img/croquis-recinto.png" alt="Croquis del recinto: escenario al frente, sección 1 con 2 filas de 5 asientos y sección 2 con 5 filas de 10 asientos">
            </picture>
        </figure>
        <div class="rejilla">
            <details open>
                <summary>Sección 1</summary>
                <div class="campo">
                    <label for="boleto-1">Nombre del boleto</label>
                    <input id="boleto-1" name="boleto-1" type="text" placeholder="Ej. VIP">
                </div>
                <div class="campo">
                    <label for="precio-1">Precio ($)</label>
                    <input id="precio-1" name="precio-1" type="number" min="0" placeholder="Ej. 500">
                </div>
                <div class="campo">
                    <label for="capacidad-1">Capacidad máxima de ese tipo</label>
                    <input id="capacidad-1" name="capacidad-1" type="number" min="0" placeholder="Ej. 10">
                </div>
                <div class="campo">
                    <label for="beneficios-1">Descripción de beneficios</label>
                    <textarea id="beneficios-1" name="beneficios-1" placeholder="Descripción de beneficios"></textarea>
                </div>
            </details>
            <details>
                <summary>Sección 2</summary>
                <div class="campo">
                    <label for="boleto-2">Nombre del boleto</label>
                    <input id="boleto-2" name="boleto-2" type="text" placeholder="Ej. VIP">
                </div>
                <div class="campo">
                    <label for="precio-2">Precio ($)</label>
                    <input id="precio-2" name="precio-2" type="number" min="0" placeholder="Ej. 500">
                </div>
                <div class="campo">
                    <label for="capacidad-2">Capacidad máxima de ese tipo</label>
                    <input id="capacidad-2" name="capacidad-2" type="number" min="0" placeholder="Ej. 10">
                </div>
                <div class="campo">
                    <label for="beneficios-2">Descripción de beneficios</label>
                    <textarea id="beneficios-2" name="beneficios-2" placeholder="Descripción de beneficios"></textarea>
                </div>
            </details>
        </div>
        <div class="acciones">
            <a class="boton secundario" href="seleccionar-recinto.html">Cancelar</a>
            <button class="boton" type="submit">Guardar asignación</button>
        </div>
    </form>
</main>
</th:block>
